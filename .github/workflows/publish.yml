name: Publish to crates.io

# Publishes on every GitHub Release using crates.io Trusted Publishing (OIDC) -
# no token stored, nothing to expire. Configured once on the crate's settings
# page (crates.io/crates/scrapeunblocker/settings -> Trusted Publishing):
# GitHub, owner ScrapeUnblocker, repo scrapeunblocker-rust, workflow
# publish.yml, environment crates-io. crates.io only allows that once the crate
# exists, so version 0.19.0 was published by hand.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Skip a version crates.io already has
        id: published
        run: |
          version=${GITHUB_REF_NAME#v}
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "scrapeunblocker-rust-release" \
            "https://crates.io/api/v1/crates/scrapeunblocker/$version")
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.exists != 'true'
        run: cargo test --all-features
      - if: steps.published.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.published.outputs.exists != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
